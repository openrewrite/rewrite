name: Dependency Submission

on:
  workflow_run:
    workflows: ["publish"]
    types:
      - completed

permissions:
  contents: write

jobs:
  dependency-submission:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v5
        env:
          # Attribute the released commit to main, the only ref Dependabot alerts are computed for
          GITHUB_DEPENDENCY_GRAPH_SHA: ${{ github.event.workflow_run.head_sha }}
          ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CODEGENOME_USERNAME }}
          ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CODEGENOME_TOKEN }}
          DEPENDENCY_GRAPH_EXCLUDE_PROJECTS: ':buildSrc'
          # Only what ships; plugin, tooling and test classpaths otherwise raise alerts for jars no consumer gets
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: 'runtimeClasspath'
