---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.sonar.SonarRules
displayName: Sonar rules for Java
description: Fixes or flags code reported by SonarQube Java rules, grouped by the default Sonar severity of each rule.
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.FindSourceFiles:
      filePattern: "**/*.java"
recipeList:
  - org.openrewrite.java.sonar.Critical
  - org.openrewrite.java.sonar.Major
  - org.openrewrite.java.sonar.Minor
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.sonar.Critical
displayName: Sonar critical rules for Java
description: Fixes or flags code reported by SonarQube Java rules whose default Sonar severity is Critical.
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.FindSourceFiles:
      filePattern: "**/*.java"
recipeList:
  - org.openrewrite.java.format.WrappingAndBraces
  - org.openrewrite.java.search.FindEmptyMethods
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.sonar.Major
displayName: Sonar major rules for Java
description: Fixes or flags code reported by SonarQube Java rules whose default Sonar severity is Major.
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.FindSourceFiles:
      filePattern: "**/*.java"
recipeList:
  - org.openrewrite.java.format.WrappingAndBraces
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.sonar.Minor
displayName: Sonar minor rules for Java
description: Fixes or flags code reported by SonarQube Java rules whose default Sonar severity is Minor.
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.FindSourceFiles:
      filePattern: "**/*.java"
recipeList:
  - org.openrewrite.java.format.EmptyNewlineAtEndOfFile
  - org.openrewrite.java.RemoveUnusedImports
  - org.openrewrite.java.search.FindEmptyClasses
