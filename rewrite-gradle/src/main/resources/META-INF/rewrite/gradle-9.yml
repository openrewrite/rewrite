---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.MigrateToGradle9
displayName: Migrate to Gradle 9 from Gradle 8
description: Migrate to version 9.x. See the Gradle upgrade guide from [version 8.x to 9.0](https://docs.gradle.org/9.0.0/userguide/upgrading_major_version_9.html) for more information.
recipeList:
  - org.openrewrite.gradle.MigrateToGradle8
  - org.openrewrite.gradle.UpdateGradleWrapper:
      version: 9.x
      addIfMissing: false
  # Map notation has been deprecated in 9.1+
  - org.openrewrite.gradle.DependencyUseStringNotation
  - org.openrewrite.gradle.gradle9.OneDependencyDeclarationPerStatement
  - org.openrewrite.gradle.gradle9.UseMainClassProperty
  - org.openrewrite.gradle.gradle9.UseMainClassPropertyForApplication
  # JavaPluginConvention was removed in Gradle 9; top-level sourceCompatibility / targetCompatibility no longer work
  - org.openrewrite.gradle.gradle9.UseJavaExtensionBlock
  - org.openrewrite.gradle.gradle9.RewriteSpreadAllInConfigurationsBlock
  # version = { } is invalid Gradle DSL; the closure form version { } must be used
  - org.openrewrite.gradle.gradle9.UseVersionClosure
  # Depending on the current project by its own module coordinates is deprecated in 9.3
  - org.openrewrite.gradle.gradle9.UseProjectDependencyInsteadOfModuleCoordinates
  # DomainObjectCollection.findAll(Closure) is deprecated in 9.4 in favor of matching(Spec)
  - org.openrewrite.gradle.gradle9.UseMatchingInsteadOfFindAll
  # Develocity plugin versions before 4.0 rely on the parent-project property lookup deprecated in 9.6
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: com.gradle.develocity
      newVersion: 4.x
  # PMD's targetJdk is deprecated in 9.6 and has no replacement
  - org.openrewrite.gradle.gradle9.RemovePmdTargetJdk
  # CreateStartScripts.exitEnvironmentVar became a no-op and is deprecated in 9.6
  - org.openrewrite.gradle.gradle9.RemoveExitEnvironmentVar
  # RepositoryHandler.flatDir(Map) / mavenCentral(Map) are deprecated in 9.6 in favor of the Action overloads
  - org.openrewrite.gradle.gradle9.UseRepositoryHandlerActionOverloads
  # The org.gradle.unsafe.isolated-projects* properties are deprecated in 9.7
  - org.openrewrite.gradle.gradle9.MigrateIsolatedProjectsProperties
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.gradle9.MigrateIsolatedProjectsProperties
displayName: Rename the incubating `org.gradle.unsafe.isolated-projects` properties
description: >-
  Gradle 9.7 promotes the Isolated Projects feature flags out of the `unsafe` namespace and deprecates the legacy
  property names. `org.gradle.unsafe.isolated-projects` becomes `org.gradle.isolated-projects`,
  `org.gradle.unsafe.isolated-projects.diagnostics` becomes `org.gradle.isolated-projects.diagnostics` and
  `org.gradle.unsafe.isolated-projects.dangerously-ignore-problems` becomes
  `org.gradle.isolated-projects.dangerously-ignore-problems`. The legacy names still work as aliases, but will be
  removed in a future release.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/gradle.properties'
recipeList:
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: org.gradle.unsafe.isolated-projects.dangerously-ignore-problems
      newPropertyKey: org.gradle.isolated-projects.dangerously-ignore-problems
      relaxedBinding: false
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: org.gradle.unsafe.isolated-projects.diagnostics
      newPropertyKey: org.gradle.isolated-projects.diagnostics
      relaxedBinding: false
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: org.gradle.unsafe.isolated-projects
      newPropertyKey: org.gradle.isolated-projects
      relaxedBinding: false
