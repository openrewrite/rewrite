---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.GradleBestPractices
displayName: Apply Gradle best practices
description: Apply a set of [Gradle best practices](https://docs.gradle.org/current/userguide/best_practices_general.html) to the build files, for more efficient and idiomatic builds.
recipeList:
  - org.openrewrite.gradle.MigrateToGradle9
  - org.openrewrite.gradle.EnableGradleBuildCache
  - org.openrewrite.gradle.EnableGradleParallelExecution
  - org.openrewrite.gradle.ChangeTaskToTasksRegister
  - org.openrewrite.gradle.RemoveRedundantDependencyVersions
  - org.openrewrite.gradle.RemoveRedundantSecurityResolutionRules
  - org.openrewrite.gradle.SortDependencies
  - org.openrewrite.gradle.security.UseHttpsForRepositories
  - org.openrewrite.gradle.security.AddGradleWrapperChecksum
  - org.openrewrite.gradle.UseUtf8FileEncoding
  - org.openrewrite.gradle.UsePropertyAssignmentSyntax:
      propertyName: distributionUrl
  - org.openrewrite.gradle.RemoveEmptyBuildscriptBlock
#  - org.openrewrite.gradle.EnableGradleConfigurationCache  # the catalog's own fix is "add it, then run
#    the build and fix what it surfaces"; a recipe can only do the first half
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.EnableGradleBuildCache
displayName: Enable Gradle build cache
description: Enable the Gradle build cache. By enabling build cache the build outputs are stored externally and fetched from the cache when it is determined that those inputs have no changed, avoiding the expensive work of regenerating them. See the [Gradle Build Cache](https://docs.gradle.org/current/userguide/build_cache.html) for more information.
recipeList:
  - org.openrewrite.gradle.AddProperty:
      key: org.gradle.caching
      value: true
      filePattern: gradle.properties
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.EnableGradleParallelExecution
displayName: Enable Gradle parallel execution
description: Most builds consist of more than one project and some of those projects are usually independent of one another. Yet Gradle will only run one task at a time by default, regardless of the project structure. By using the `--parallel` switch, you can force Gradle to execute tasks in parallel as long as those tasks are in different projects. See the [Gradle performance documentation](https://docs.gradle.org/current/userguide/performance.html#parallel_execution) for more information.
recipeList:
  - org.openrewrite.gradle.AddProperty:
      key: org.gradle.parallel
      value: true
      filePattern: gradle.properties
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.UseUtf8FileEncoding
displayName: Use UTF-8 file encoding
description: >-
  Append `-Dfile.encoding=UTF-8` to `org.gradle.jvmargs` so the build reads and writes text the same way wherever it
  runs, rather than inheriting whatever default encoding the machine happens to have. Only an existing
  `org.gradle.jvmargs` is appended to: setting that property replaces Gradle's default daemon arguments rather than
  adding to them, so creating it to hold only an encoding would drop the default heap and metaspace settings. An
  encoding already set, UTF-8 or otherwise, is left as it is. See the
  [Gradle best practice](https://docs.gradle.org/current/userguide/best_practices_performance.html#use_utf8_encoding).
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/gradle.properties'
recipeList:
  - org.openrewrite.properties.ChangePropertyValue:
      propertyKey: org.gradle.jvmargs
      oldValue: '^(?!.*-Dfile\.encoding).+$'
      newValue: '$0 -Dfile.encoding=UTF-8'
      regex: true
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.EnableGradleConfigurationCache
displayName: Enable the Gradle configuration cache
description: >-
  Set `org.gradle.configuration-cache=true` so Gradle can skip the configuration phase when nothing it depends on has
  changed. Deliberately not part of `org.openrewrite.gradle.GradleBestPractices`: enabling it surfaces configuration
  cache violations in build logic that have to be fixed by hand before the build will run, so this is the first half of
  a change whose second half a recipe cannot make. See the
  [Gradle best practice](https://docs.gradle.org/current/userguide/best_practices_performance.html#use_configuration_cache).
recipeList:
  - org.openrewrite.gradle.AddProperty:
      key: org.gradle.configuration-cache
      value: true
      filePattern: gradle.properties
