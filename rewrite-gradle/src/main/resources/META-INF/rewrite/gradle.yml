---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.GradleBestPractices
displayName: Apply Gradle best practices
description: Apply a set of [Gradle best practices](https://docs.gradle.org/current/userguide/best_practices_general.html) to the build files, for more efficient and idiomatic builds.
recipeList:
  - org.openrewrite.gradle.MigrateToGradle9
  - org.openrewrite.gradle.EnableGradleBuildCache
  - org.openrewrite.gradle.EnableGradleParallelExecution
  - org.openrewrite.gradle.ChangeTaskToTasksRegister
  - org.openrewrite.gradle.RemoveRedundantDependencyVersions
  - org.openrewrite.gradle.RemoveRedundantSecurityResolutionRules
  - org.openrewrite.gradle.SortDependencies
  - org.openrewrite.gradle.security.UseHttpsForRepositories
  - org.openrewrite.gradle.UsePropertyAssignmentSyntax:
      propertyName: distributionUrl
  - org.openrewrite.gradle.RemoveEmptyBuildscriptBlock
  - org.openrewrite.gradle.AddRootProjectName
  - org.openrewrite.gradle.MoveRepositoriesToSettings
  - org.openrewrite.gradle.RemoveInheritedDependencies
  - org.openrewrite.gradle.RemoveNonReproducibleArchiveSettings
  - org.openrewrite.gradle.UseLoggingGetLogger
  - org.openrewrite.gradle.UsePluginsBlock
  - org.openrewrite.gradle.RemoveExplicitKotlinStdlibDependency
#  - org.openrewrite.gradle.UseDefaultPathSensitivity  # changes task cache keys; a task that writes its input's
#    path into its output would start taking wrong cache hits, silently
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.EnableGradleBuildCache
displayName: Enable Gradle build cache
description: Enable the Gradle build cache. By enabling build cache the build outputs are stored externally and fetched from the cache when it is determined that those inputs have no changed, avoiding the expensive work of regenerating them. See the [Gradle Build Cache](https://docs.gradle.org/current/userguide/build_cache.html) for more information.
recipeList:
  - org.openrewrite.gradle.AddProperty:
      key: org.gradle.caching
      value: true
      filePattern: gradle.properties
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.EnableGradleParallelExecution
displayName: Enable Gradle parallel execution
description: Most builds consist of more than one project and some of those projects are usually independent of one another. Yet Gradle will only run one task at a time by default, regardless of the project structure. By using the `--parallel` switch, you can force Gradle to execute tasks in parallel as long as those tasks are in different projects. See the [Gradle performance documentation](https://docs.gradle.org/current/userguide/performance.html#parallel_execution) for more information.
recipeList:
  - org.openrewrite.gradle.AddProperty:
      key: org.gradle.parallel
      value: true
      filePattern: gradle.properties
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.RemoveExplicitKotlinStdlibDependency
displayName: Remove explicit Kotlin standard library dependency
description: >-
  The Kotlin Gradle plugin adds the version of `kotlin-stdlib` that matches itself, so declaring the dependency
  explicitly is redundant and can pin a version that disagrees with the plugin. Removes
  `org.jetbrains.kotlin:kotlin-stdlib` and its `-jdk7`, `-jdk8` and `-common` variants, written either as coordinates
  or with the Kotlin DSL `kotlin("stdlib")` helper, but only from a project that applies a Kotlin plugin — without one
  the standard library is an ordinary dependency the project needs, and removing it would stop the build compiling.
  Only `implementation` declarations are removed, because that is the one configuration the Kotlin plugin contributes
  the standard library to: a declaration on `api` is consumer-visible through the published compile scope, and one on
  a configuration of the project's own has nothing putting it back.
  See the
  [Gradle best practice](https://docs.gradle.org/current/userguide/best_practices_dependencies.html#dont_depend_on_kotlin_stdlib).
preconditions:
  - org.openrewrite.gradle.search.FindPlugins:
      pluginId: org.jetbrains.kotlin*
recipeList:
  - org.openrewrite.gradle.RemoveDependency:
      groupId: org.jetbrains.kotlin
      artifactId: kotlin-stdlib*
      configuration: implementation
