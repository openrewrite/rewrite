junit.jupiter.extensions.autodetection.enabled=true

# Each test JVM runs four classes at once, starting with the slowest, so its classes balance themselves; the test task
# in build.gradle.kts starts a quarter as many forks to keep about as many classes running
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
# Without this, every test waiting on a tooling API build lets the pool start one more class
junit.jupiter.execution.parallel.config.fixed.max-pool-size=4
junit.jupiter.testclass.order.default=org.openrewrite.gradle.SlowestFirstClassOrderer
